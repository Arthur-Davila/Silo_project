services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]

  api:
    build:
      context: ../api
    container_name: silo-api
    restart: unless-stopped
    environment:
      API_PORT: "3001"
      DB_PATH: /data/telemetry.sqlite
      MQTT_HOST: host.docker.internal
      MQTT_PORT: "1883"
      MQTT_TOPIC: silo/dados
    ports:
      - "3001:3001"
    volumes:
      - telemetry-data:/data

  frontend:
    build:
      context: ../../frontend
    container_name: silo-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "8443:8443"
    depends_on:
      - api

  node-red:
    image: nodered/node-red:latest
    container_name: node-red
    restart: unless-stopped
    user: "root"
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Recife
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto

volumes:
  mqtt-data:
  telemetry-data: